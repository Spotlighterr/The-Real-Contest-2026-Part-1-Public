<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần thi trực tiếp - Vòng Chung Kết</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Montserrat:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap&subset=vietnamese" rel="stylesheet">
    <style>
        :root {
            /* Design System Tokens (Option 3: Apple Glassmorphism Style) */
            --canvas: #030307; 
            --glass-bg: rgba(255, 255, 255, 0.035);
            --glass-bg-hover: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-border-hover: rgba(255, 255, 255, 0.2);
            
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --accent-hover: #818cf8;
            
            --ink: #ffffff;
            --ink-muted: #cbd5e1; 
            --ink-subtle: #94a3b8; 
            
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.25);
            --error: #ef4444;
            --error-glow: rgba(239, 68, 68, 0.25);
            --warning: #f59e0b;
            --warning-glow: rgba(245, 158, 11, 0.25);
            --skip: #64748b;
            --skip-glow: rgba(100, 116, 139, 0.25);
            
            --rounded-sm: 8px;
            --rounded-md: 12px;
            --rounded-lg: 24px;
            --rounded-full: 9999px;
            
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-bounce: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--canvas);
            color: var(--ink);
            text-align: center;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* --- NỀN SHIFTING BLURRED MESH --- */
        .glow-blob {
            position: absolute;
            border-radius: var(--rounded-full);
            filter: blur(140px);
            -webkit-filter: blur(140px);
            z-index: -1;
            opacity: 0.16;
            pointer-events: none;
            animation: floatBlob 22s infinite alternate ease-in-out;
        }
        .blob-1 {
            width: 480px;
            height: 480px;
            background: var(--accent);
            top: -120px;
            left: 8%;
        }
        .blob-2 {
            width: 520px;
            height: 520px;
            background: #a855f7; /* Tím */
            bottom: -150px;
            right: 6%;
            animation-delay: -5s;
        }
        .blob-3 {
            width: 400px;
            height: 400px;
            background: var(--success);
            top: 35%;
            right: 25%;
            opacity: 0.08;
            animation-delay: -11s;
        }
        .blob-4 {
            width: 350px;
            height: 350px;
            background: var(--error);
            top: 20%;
            left: 30%;
            opacity: 0.06;
            animation-delay: -15s;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, 40px) scale(1.15); }
            100% { transform: translate(-40px, -60px) scale(0.9); }
        }

        /* --- MÀN HÌNH BẮT ĐẦU --- */
        #start-screen {
            margin-top: 10vh;
            max-width: 850px; /* Expanded width to fit the single-line title beautifully and prevent text clipping */
            width: 95%;
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            padding: 50px 45px; /* Restored balanced padding */
            border-radius: var(--rounded-lg);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            display: block;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transition: var(--transition-smooth);
            text-align: center;
        }
        #start-screen:hover {
            border-color: var(--glass-border-hover);
            box-shadow: 0 40px 100px rgba(99, 102, 241, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }
        #start-screen h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(20px, 4.5vw, 36px); /* Balanced font size to prevent overflow */
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 40%, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        #start-credit {
            position: fixed;
            bottom: 25px;
            left: 25px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 500;
            color: var(--ink-subtle);
            letter-spacing: 0.05em;
            opacity: 0.55; /* Restored to the initial clear value */
            user-select: none;
            transition: opacity 0.3s, color 0.3s;
            z-index: 10;
        }
        #start-credit:hover {
            opacity: 0.7;
            color: var(--accent-hover);
        }
        .start-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 40px;
        }
        .btn-start {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            padding: 16px 50px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: var(--rounded-md);
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
            transition: var(--transition-smooth);
        }
        .btn-start:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.55);
        }
        .btn-start:active {
            transform: translateY(0);
        }

        /* --- THANH TRẠNG THÁI (ẨN ĐI THEO THIẾT KẾ MỚI) --- */
        #top-bar {
            display: none !important;
        }

        /* --- BỘ HIỂN THỊ ĐỘI, ĐIỂM, THỜI GIAN TRONG KHUNG CÂU HỎI --- */
        #question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .header-left {
            display: flex;
            gap: 12px;
            align-items: center;
            flex: 1;
            justify-content: flex-start;
        }
        .header-right {
            display: flex;
            align-items: center;
            flex: 1;
            justify-content: flex-end;
        }
        .header-status-box {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--rounded-md);
            padding: 8px 18px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.01em;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition-smooth);
        }
        .header-status-box:hover {
            border-color: var(--glass-border-hover);
            transform: translateY(-1px);
        }
        #header-team-box { 
            border-left: 3px solid var(--accent); 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 10px rgba(99, 102, 241, 0.1);
        }
        #header-score-box { 
            border-left: 3px solid var(--warning); 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 10px rgba(245, 158, 11, 0.1);
        }
        #header-timer-box { 
            border-left: 3px solid var(--error); 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 10px rgba(239, 68, 68, 0.1);
        }
        #team-name-display { color: var(--accent-hover); }
        #score { color: var(--warning); }
        #timer-value { color: var(--error); font-family: 'JetBrains Mono', monospace; }

        /* --- KHUNG CHỨA CHÍNH (MAIN CONTAINER) --- */
        #question-container {
            display: none; 
            background: var(--glass-bg);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid var(--glass-border);
            border-radius: var(--rounded-lg);
            padding: 35px 50px;
            width: 98%;
            max-width: 1800px; /* Expanded almost to full screen width */
            min-height: 930px; /* Increased to allow question box to expand downwards */
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            position: relative;
            flex-direction: column;
            animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            transition: var(--transition-smooth);
        }
        #question-container:hover {
            border-color: var(--glass-border-hover);
            box-shadow: 0 45px 110px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }
        #question-points {
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            color: var(--warning);
            margin: 0; /* Align perfectly with header status boxes */
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        #question-points::before, #question-points::after {
            content: "";
            display: block;
            width: 30px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--warning), transparent);
        }

        /* --- KHUNG PHỤ 1: KHUNG CÂU HỎI (QUESTION CARD FRAME) --- */
        #question-text-wrapper {
            position: relative;
            flex-grow: 1; 
            width: 100%;
            height: 560px; /* Chiều cao tăng lên giúp khung câu hỏi rộng rãi, tràn sâu xuống dưới */
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--rounded-md);
            padding: 30px 35px; /* Symmetric padding since label is removed */
            margin: 15px 0;
            display: flex;
            /* Removed align-items: center and justify-content: center to prevent top overflow cut-off */
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
            overflow-y: auto;
            transition: var(--transition-smooth);
        }
        #question-text-wrapper:hover {
            border-color: rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.3);
        }
        #question-text {
            font-size: 26px; /* Slightly reduced font size to prevent overflow/scrolling */
            line-height: 1.65;
            text-align: justify; 
            white-space: pre-line;
            width: 100%;
            font-weight: 500;
            color: var(--ink);
            animation: slideUpFade 0.5s ease-out;
            margin: auto; /* Centers when content fits, aligns to start/top when overflowing to prevent top-cut-off scroll bug */
        }

        /* Nhãn định vị kỹ thuật số tinh tế cho các khung phụ */
        .frame-label {
            position: absolute;
            top: 12px;
            left: 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-subtle);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .frame-label::before {
            content: "";
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: var(--rounded-full);
            background-color: var(--ink-subtle);
        }

        /* --- KHUNG PHỤ 2: KHUNG ĐÁP ÁN (ANSWER CARD FRAME) --- */
        #answer-box {
            position: relative;
            visibility: hidden; 
            opacity: 0;
            width: 100%;
            height: 90px; /* Chiều cao cố định của khung đáp án phụ */
            background-color: rgba(255, 255, 255, 0.01);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: var(--rounded-md);
            padding: 30px 30px 20px 30px;
            margin-top: 5px;
            font-size: 26px;
            color: var(--success);
            font-weight: 700;
            letter-spacing: -0.01em;
            transition: var(--transition-bounce);
            transform: translateY(12px);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #answer-box.show {
            visibility: visible;
            opacity: 1;
            transform: translateY(0);
            background-color: rgba(16, 185, 129, 0.06);
            border: 1px solid var(--success);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .answer-label {
            transition: color 0.4s ease;
        }
        .answer-label::before {
            transition: background-color 0.4s ease;
        }
        #answer-box.show .answer-label {
            color: var(--success);
        }
        #answer-box.show .answer-label::before {
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        /* Trạng thái SAI (Đỏ) */
        #answer-box.show.wrong {
            background-color: rgba(239, 68, 68, 0.06);
            border-color: var(--error);
            color: var(--error);
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        #answer-box.show.wrong .answer-label {
            color: var(--error);
        }
        #answer-box.show.wrong .answer-label::before {
            background-color: var(--error);
            box-shadow: 0 0 8px var(--error);
        }

        /* Trạng thái BỎ QUA (Xám) */
        #answer-box.show.skip {
            background-color: rgba(100, 116, 139, 0.06);
            border-color: var(--skip);
            color: var(--ink-muted);
            box-shadow: 0 10px 30px rgba(100, 116, 139, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        #answer-box.show.skip .answer-label {
            color: var(--skip);
        }
        #answer-box.show.skip .answer-label::before {
            background-color: var(--skip);
            box-shadow: 0 0 8px var(--skip);
        }

        /* Wrapper cho nút điều khiển và bộ âm thanh đặt song song */
        .bottom-controls-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 25px;
            flex-shrink: 0;
        }

        /* Nút điều khiển */
        .btn-group {
            margin: 0; /* Remove top margin as it's aligned inside bottom-controls-wrapper */
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-shrink: 0;
            transition: var(--transition-smooth);
        }
        .btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            padding: 14px 28px;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            border-radius: var(--rounded-md);
            color: var(--ink);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-weight: 700;
            letter-spacing: -0.01em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition-smooth);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-show { 
            background-color: rgba(99, 102, 241, 0.05); 
            border-color: rgba(99, 102, 241, 0.35);
            color: var(--accent-hover);
        }
        .btn-show:hover { 
            background-color: var(--accent); 
            border-color: var(--accent);
            color: white;
            box-shadow: 0 8px 25px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .btn-correct { 
            background-color: rgba(16, 185, 129, 0.05); 
            border-color: rgba(16, 185, 129, 0.35);
            color: var(--success);
        }
        .btn-correct:hover { 
            background-color: var(--success); 
            border-color: var(--success);
            color: white;
            box-shadow: 0 8px 25px var(--success-glow), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .btn-skip { 
            background-color: rgba(100, 116, 139, 0.05); 
            border-color: rgba(100, 116, 139, 0.35);
            color: var(--ink-muted);
        }
        .btn-skip:hover { 
            background-color: var(--skip); 
            border-color: var(--skip);
            color: white;
            box-shadow: 0 8px 25px var(--skip-glow), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .btn-wrong { 
            background-color: rgba(239, 68, 68, 0.05); 
            border-color: rgba(239, 68, 68, 0.35);
            color: var(--error);
        }
        .btn-wrong:hover { 
            background-color: var(--error); 
            border-color: var(--error);
            color: white;
            box-shadow: 0 8px 25px var(--error-glow), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .btn-restart { 
            background-color: var(--accent); 
            font-size: 20px; 
            padding: 16px 45px; 
            margin-top: 40px;
            border: none;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.35);
        }
        .btn-restart:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.55);
        }

        /* --- MÀN HÌNH KẾT THÚC --- */
        #finish-screen {
            display: none;
            max-width: 600px;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            padding: 50px 40px;
            border-radius: var(--rounded-lg);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            margin-top: 10vh;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #finish-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 42px;
            color: var(--success);
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
        }
        .finish-label {
            font-family: 'Montserrat', sans-serif;
            color: var(--ink-muted);
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            margin-top: 30px;
        }
        .finish-value {
            font-family: 'Montserrat', sans-serif;
            font-size: 38px;
            font-weight: 800;
            margin-top: 5px;
            letter-spacing: -0.02em;
        }
        #final-team {
            color: var(--accent-hover);
        }
        #final-score {
            color: var(--warning);
        }

        /* --- BỘ ĐIỀU KHIỂN ÂM THANH SONG SONG (PARALLEL MUSIC CONTROLLER) --- */
        #music-controller {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: var(--transition-smooth);
        }
        #music-controller:hover {
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .music-btn {
            background: none;
            border: none;
            color: var(--ink);
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.05);
        }
        .music-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--accent-hover);
        }
        .volume-slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 0;
            overflow: hidden;
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #music-controller:hover .volume-slider-container {
            width: 140px;
        }
        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 90px;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            outline: none;
            transition: background 0.2s;
        }
        .volume-slider:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-hover);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 6px var(--accent-glow);
            transition: transform 0.1s ease, background-color 0.1s ease;
        }
        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.3);
            background: #ffffff;
        }
        .volume-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-hover);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 6px var(--accent-glow);
            transition: transform 0.1s ease, background-color 0.1s ease;
        }
        .volume-slider::-moz-range-thumb:hover {
            transform: scale(1.3);
            background: #ffffff;
        }
        #volume-pct {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-hover);

            100% { transform: scaleY(1); }
        }

            50% { opacity: 0.4; transform: scale(1.1); color: #ff6b6b; }
            100% { opacity: 1; transform: scale(1); }
        }

        function playSound(sound) {
            if (isMuted || !sound) return;
            sound.currentTime = 0; // Rewind về đầu để có thể phát liên tiếp nhanh
            sound.play().catch(err => console.log("Lỗi phát âm thanh:", err));

        function toggleBgMusic() {

            if (sounds.bgMusic.paused) {
                sounds.bgMusic.play()
                    .then(() => {
                        isMusicPlaying = true;
                        updateMusicUI(true);
                    })
                    .catch(err => {
                        console.log("Trình duyệt chặn phát nhạc tự động:", err);
                    });
            } else {

                isMusicPlaying = false;
                updateMusicUI(false);

        // Hàm giảm dần âm lượng nhạc nền rồi tắt (fade out) trong khoảng thời gian xác định
        function fadeOutBgMusic(durationMs = 3000) {
            const startVolume = sounds.bgMusic.volume;
            // Nếu nhạc đã dừng sẵn hoặc âm lượng đã là 0, dừng ngay lập tức
            if (sounds.bgMusic.paused || startVolume === 0) {
                sounds.bgMusic.pause();
                updateMusicUI(false);
                return;
            }
            
            const intervalTime = 50; // Cập nhật mỗi 50ms để hiệu ứng mượt mà
            const steps = durationMs / intervalTime;
            const volumeDecrease = startVolume / steps;
            
            let currentStep = 0;
            const fadeInterval = setInterval(() => {
                currentStep++;
                let newVolume = startVolume - (volumeDecrease * currentStep);
                if (newVolume <= 0) {
                    newVolume = 0;
                }
                sounds.bgMusic.volume = newVolume;
                
                if (currentStep >= steps || newVolume <= 0) {
                    clearInterval(fadeInterval);
                    sounds.bgMusic.pause();
                    // Khôi phục lại âm lượng ban đầu để sẵn sàng cho lần phát tiếp theo
                    sounds.bgMusic.volume = startVolume;
                    updateMusicUI(false);
                }
            }, intervalTime);
        }

            sounds.bgMusic.volume = volume;
            const pct = Math.round(volume * 100);
            document.getElementById('volume-pct').innerText = pct + "%";
        }

                sounds[key].muted = isMuted;
            }
            // Phát click khi unmute (trạng thái mới = false)
            if (!isMuted) {
                playSound(sounds.click);
            }
            updateMuteUI(isMuted);
        }

        function updateMusicUI(isPlaying) {
            const playIcon = document.getElementById('play-icon');
            const pauseIcon = document.getElementById('pause-icon');
            const visualizer = document.getElementById('visualizer');
            
            if (isPlaying) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                visualizer.classList.add('playing');
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                visualizer.classList.remove('playing');
            }
        }

        function updateMuteUI(muted) {
            const onIcon = document.getElementById('volume-on-icon');
            const offIcon = document.getElementById('volume-off-icon');
            const visualizer = document.getElementById('visualizer');
            
            if (muted) {
                onIcon.style.display = 'none';
                offIcon.style.display = 'block';
                visualizer.classList.remove('playing');
            } else {
                onIcon.style.display = 'block';
                offIcon.style.display = 'none';
                if (!sounds.bgMusic.paused) {
                    visualizer.classList.add('playing');
                }
            }
        }

        // --- CÁC HÀM XỬ LÝ TRÒ CHƠI ---
        function startQuiz() {
            if (!selectedTeam) return;
            playSound(sounds.click);
            
            document.getElementById('team-name-display').innerText = selectedTeam;
            document.getElementById('final-team').innerText = selectedTeam;

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('start-credit').style.display = 'none'; // Hide viewport credit on quiz start
            document.getElementById('top-bar').style.display = 'flex';
            document.getElementById('question-container').style.display = 'flex';

            // Nạp bộ câu hỏi tương ứng cho đội thi đã chọn
            if (teamQuestionPools[selectedTeam]) {
                questions = teamQuestionPools[selectedTeam].map(index => allQuestions[index]);
            } else {
                questions = allQuestions;
            }

            isQuizActive = true;
            updateUI();
            startTimer();

            // Khởi động nhạc nền
            sounds.bgMusic.play()
                .then(() => {
                    isMusicPlaying = true;
                    updateMusicUI(true);
                })
                .catch(err => {
                    console.log("Trình duyệt chặn autoplay nhạc nền. Nhạc nền sẽ chạy khi tương tác trực tiếp.", err);
                    isMusicPlaying = false;
                    updateMusicUI(false);
                });
        }

        function restartQuiz() {
            playSound(sounds.click);
            setTimeout(() => {
                location.reload(); 
            }, 150);
        }

        function updateUI() {
            if (currentQuestionIndex < questions.length) {
                const q = questions[currentQuestionIndex];
                
                // Hiệu ứng đổi câu hỏi mượt mà
                const qText = document.getElementById('question-text');
                qText.style.animation = 'none';
                qText.offsetHeight; // Trigger reflow
                qText.style.animation = 'slideUpFade 0.5s ease-out';

                document.getElementById('question-index').innerText = (currentQuestionIndex + 1);
                document.getElementById('points-value').innerText = q.points;
                
                // Thiết lập văn bản và làm sạch khoảng trắng cho câu 30 điểm
                let cleanText = q.text;
                if (q.points === 30) {
                    cleanText = q.text.replace(/\n\s*\n+/g, '\n').trim();
                }
                qText.innerText = cleanText;

                // Mặc định cỡ chữ ban đầu là 26px (bằng gói 10 và 20 điểm)
                qText.style.fontSize = '26px';

                // Tự động tối ưu cỡ chữ đối với các câu hỏi 30 điểm nếu bị tràn/phải scroll
                if (q.points === 30) {
                    const parent = document.getElementById('question-text-wrapper');
                    let currentSize = 26;
                    const minSize = 17; // Giới hạn cỡ chữ nhỏ nhất để đảm bảo tính dễ đọc
                    
                    // Thu nhỏ cỡ chữ từng bước cho đến khi vừa khít khung hoặc chạm giới hạn dưới
                    while (parent.scrollHeight > parent.clientHeight && currentSize > minSize) {
                        currentSize--;
                        qText.style.fontSize = currentSize + 'px';
                    }
                }
                
                // Đóng và ẩn đáp án, dọn dẹp các class trạng thái
                const answerBox = document.getElementById('answer-box');
                answerBox.classList.remove('show', 'wrong', 'skip');
                document.getElementById('answer-text').innerText = ''; // Xóa chữ đáp án khi tải câu mới
                document.getElementById('score').innerText = score;
            } else {
                clearInterval(timerInterval);
                endGame(false);
            }
        }



        function answer(type) {
            if (currentQuestionIndex >= questions.length || !isQuizActive || isTransitioning) return;

            // Khóa tương tác tạm thời để chống click trùng lặp khi đang hiện đáp án 1s
            isTransitioning = true;

            const q = questions[currentQuestionIndex];
            const answerBox = document.getElementById('answer-box');
            
            // Dọn dẹp trạng thái màu cũ
            answerBox.classList.remove('wrong', 'skip');

            // 1. Cấu hình màu sắc dựa trên kết quả
            if (type === 'wrong') {
                answerBox.classList.add('wrong'); // Chuyển ô sang màu đỏ
            } else if (type === 'skip') {
                answerBox.classList.add('skip');   // Chuyển ô sang màu xám
            }

            // Hiển thị đáp án ngay lập tức trên màn hình
            document.getElementById('answer-text').innerText = q.answer;
            answerBox.classList.add('show');

            // 2. Tính điểm và phát âm thanh tương ứng
            if (type === 'correct') {
                score += q.points; 
                playSound(sounds.correct);
            } else if (type === 'wrong') {
                score -= (q.points / 2); 
                playSound(sounds.wrong);
            } else if (type === 'skip') {
                playSound(sounds.skip);
            }
            
            
            // Cập nhật điểm số ngay lập tức trên thanh trạng thái
            document.getElementById('score').innerText = score;
            
            // 3. Đợi đúng 1 giây (1000ms) rồi mới dọn dẹp và chuyển sang câu hỏi mới
            setTimeout(() => {
                // Ẩn và xóa chữ đáp án khi hết 1s
                answerBox.classList.remove('show', 'wrong', 'skip');
                document.getElementById('answer-text').innerText = '';

                // Chuyển sang câu tiếp theo
                currentQuestionIndex++;
                updateUI();

                // Mở khóa để MC tiếp tục tương tác
                isTransitioning = false;
            }, 1000);
        }

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            document.getElementById('timer-value').innerText = 
                (minutes < 10 ? "0" : "") + minutes + ":" + 
                (seconds < 10 ? "0" : "") + seconds;
        }

        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                // Phát hiệu ứng nhấp nháy cảnh báo nếu còn dưới 10 giây
                if (timeLeft === 10) {
                    document.getElementById('timer-value').style.animation = 'timerPulse 0.8s infinite ease-in-out';
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame(true);
                }
            }, 1000);
        }

        function endGame(isTimeOut) {
            isQuizActive = false; 
            
            // Dừng nhạc nền từ từ (fade out trong 3s) và phát nhạc chiến thắng/kết thúc
            fadeOutBgMusic(3000);
            playSound(sounds.victory);

            document.getElementById('top-bar').style.display = 'none';
            document.getElementById('question-container').style.display = 'none';
            document.getElementById('finish-screen').style.display = 'block';
            document.getElementById('final-score').innerText = score;

            if (isTimeOut) {
                document.getElementById('finish-title').innerHTML = "HẾT GIỜ!";
                document.getElementById('finish-title').style.color = "var(--error)";
            }
        }

        // --- XỬ LÝ SỰ KIỆN BÀN PHÍM ---
        document.addEventListener('keydown', function(event) {
            // Nhấn Enter để bắt đầu
            if (event.key === 'Enter' && !isQuizActive && document.getElementById('start-screen').style.display !== 'none') {
                startQuiz();
                return;
            }

            // Nhấn R để reload — chỉ cho phép khi KHÔNG đang thi, hoặc yêu cầu xác nhận nếu đang thi
            if (event.key.toLowerCase() === 'r') {
                if (isQuizActive) {
                    if (confirm('⚠️ Đang thi đấu! Bạn có chắc chắn muốn quay lại màn hình chính? Mọi tiến trình sẽ bị mất.')) {
                        restartQuiz();
                    }
                } else {
                    restartQuiz();
                }
                return;
            }

            // Nhấn M để bật tắt tiếng nhanh
            if (event.key.toLowerCase() === 'm') {
                toggleMute();
                return;
            }

            // Nhấn P để bật tắt nhạc nền nhanh
            if (event.key.toLowerCase() === 'p') {
                if (isQuizActive) {
                    toggleBgMusic();
                }
                return;
            }

            if (!isQuizActive || isTransitioning) return;

            // Phím tắt trong quá trình thi đấu: Đúng [1], Sai [2], Bỏ qua [3]
            if (event.key === '1') {
                answer('correct');
            } else if (event.key === '2') {
                answer('wrong');
            } else if (event.key === '3') {
                answer('skip');
            }
        });
    </script>
